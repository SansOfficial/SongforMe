# xcodegen 的工程描述：改完运行 `xcodegen`，不要手改 .xcodeproj
name: SongforMe
options:
  bundleIdPrefix: com.sansofficial
  deploymentTarget: { macOS: "15.0" }
  developmentLanguage: zh-Hans
packages:
  SongforMeKit: { path: Kit }
targets:
  SongforMe:
    type: application
    platform: macOS
    # local/sources 是自己接的音源，没有这个目录就编译成不带音源的版本
    sources: [Mac, { path: ../local/sources, optional: true }]
    dependencies: [{ package: SongforMeKit }]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: SongforMe
        CFBundleShortVersionString: "1.9"
        CFBundleVersion: "10"
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        # 音源可以连用户自己填的、局域网里的服务器
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSLocalNetworkUsageDescription: 连接你填写的音乐服务器
        # 本地音乐放在这些地方时，系统会先问一下
        NSDocumentsFolderUsageDescription: 播放你添加的文件夹里的音乐
        NSDownloadsFolderUsageDescription: 播放你添加的文件夹里的音乐
        NSDesktopFolderUsageDescription: 播放你添加的文件夹里的音乐
        NSRemovableVolumesUsageDescription: 播放移动硬盘里你添加的文件夹中的音乐
        NSNetworkVolumesUsageDescription: 播放网络磁盘里你添加的文件夹中的音乐
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sansofficial.songforme
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
